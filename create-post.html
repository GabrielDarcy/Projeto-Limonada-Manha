<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Amor | Nova publicação</title>
    <meta name="description" content="Crie uma nova publicação para adoção ou ajuda de animais." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="create-post">
    <header class="home-header">
      <div class="container home-nav">
        <a class="brand-row" href="index.html">
          <span class="brand-icon">🐾</span>
          <span>Pet Amor</span>
        </a>

        <nav class="home-links">
          <a href="index.html">Início</a>
          <a href="index.html#adoes">Adoções</a>
          <a href="index.html#ajuda">Como ajudar</a>
        </nav>

        <div class="home-actions" id="homeUserActions">
          <a href="index.html" class="btn btn-secondary">Voltar</a>
        </div>
      </div>
    </header>

    <main class="create-post-layout">
      <form id="createPostForm" class="create-post-form">
        <div class="form-top">
          <span class="eyebrow">Nova publicação</span>
          <h2>Publicar pet para adoção ou ajuda</h2>
        </div>

        <div class="form-grid">
          <label class="full-span">
            Título da publicação
            <input type="text" name="title" placeholder="Ex.: Bella precisa de um lar" required />
          </label>

          <label class="full-span">
            Descrição
            <textarea name="description" placeholder="Conte um pouco sobre a história, comportamento e necessidades do animal." required></textarea>
          </label>

          <label>
            Tipo de animal
            <select name="animalType" required>
              <option value="">Selecione</option>
              <option value="Cachorro">Cachorro</option>
              <option value="Gato">Gato</option>
              <option value="Fazenda">Animal de Fazenda</option>
              <option value="Exótico">Animal Exótico</option>
              <option value="Marinho">Animal Marinho</option>
            </select>
          </label>

          <label>
            Estado
            <select name="state" id="postState" required>
              <option value="">Carregando estados...</option>
            </select>
          </label>

          <label>
            Cidade
            <select name="city" id="postCity" required disabled>
              <option value="">Selecione o estado primeiro</option>
            </select>
          </label>

          <div class="full-span post-genetics-fields" id="postGeneticsFields" hidden>
            <label>
              Raça do animal
              <select name="breed" id="postBreed"></select>
            </label>
            <label>
              Raça da mãe
              <select name="motherBreed" id="postMotherBreed"></select>
            </label>
            <label>
              Raça do pai
              <select name="fatherBreed" id="postFatherBreed"></select>
            </label>
          </div>

          <label class="full-span" id="postSpeciesField" hidden>
            Raça/Espécie
            <input type="text" name="species" id="postSpecies" placeholder="Ex.: Cavalo, coelho, tartaruga..." />
          </label>

          <label>
            WhatsApp / Telefone
            <input type="tel" name="phone" inputmode="numeric" maxlength="15" placeholder="(11) 99999-0000" />
          </label>

          <label>
            E-mail de contato
            <input type="email" name="email" placeholder="contato@email.com" />
          </label>

          <label>
            Instagram
            <span class="input-group">
              <span class="input-group-prefix" aria-hidden="true">@</span>
              <input type="text" name="instagram" placeholder="usuario" maxlength="30" autocomplete="off" />
            </span>
            <small>Use apenas letras, números, pontos e underlines.</small>
          </label>

          <div class="full-span photo-gallery-field">
            <div class="photo-gallery-heading">
              <div>
                <strong>Fotos do animal</strong>
                <small>Adicione até 4 fotos em JPG, JPEG ou PNG.</small>
              </div>
              <span id="photoCount">0/4</span>
            </div>
            <div class="photo-gallery" id="photoGallery">
              <button class="photo-add-button" id="photoAddButton" type="button" aria-label="Adicionar fotos">+</button>
            </div>
            <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
          </div>
        </div>

        <div class="home-actions-row" style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary">Salvar publicação</button>
          <a href="index.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </main>

    <script type="module" src="script.js?v=18"></script>
  </body>
</html>
