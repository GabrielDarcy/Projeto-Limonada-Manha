<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Amor | Nova publicação</title>
    <meta name="description" content="Crie uma nova publicação para adoção ou ajuda de animais." />
    <meta name="keywords" content="Pet Amor, publicar pet, cadastrar animal para adoção" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://SEU-DOMINIO.com.br/create-post.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pet Amor" />
    <meta property="og:title" content="Pet Amor | Publicar um pet" />
    <meta property="og:description" content="Cadastre um animal para adoção ou peça ajuda à comunidade Pet Amor." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1517849845537-4d257902454a" />
    <meta property="og:url" content="https://SEU-DOMINIO.com.br/create-post.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=29" />
  </head>
  <body data-page="create-post">
    <header class="home-header">
      <div class="container home-nav">
        <a class="brand-row" href="index.html">
          <img class="brand-icon" src="https://placehold.co/42x42/ffe8ce/7a3d16?text=Logo" alt="Pet Amor Logo" />
          <span>Pet Amor</span>
        </a>

        <nav class="home-links">
          <a href="index.html">Início</a>
          <a href="index.html#adoes">Adoções</a>
          <a href="index.html#ajuda">Como ajudar</a>
        </nav>

        <div class="home-actions" id="homeUserActions">
          <a href="index.html" class="btn btn-secondary">Voltar</a>
        </div>
      </div>
    </header>

    <main class="create-post-layout">
      <form id="createPostForm" class="create-post-form">
        <div class="form-top">
          <span class="eyebrow">Nova publicação</span>
          <h2>Publicar pet para adoção ou ajuda</h2>
        </div>

        <div class="form-grid post-progressive-stage" id="postIntroStep">
          <label>
            Tipo de animal
            <select name="animalType">
              <option value="">Selecione</option>
              <option value="Cachorro">Cachorro</option>
              <option value="Gato">Gato</option>
              <option value="Fazenda">Animal de Fazenda</option>
              <option value="Exótico">Animal Exótico</option>
              <option value="Marinho">Animal Marinho</option>
            </select>
          </label>

          <label>
            WhatsApp ou Telefone
            <input type="tel" name="phone" inputmode="numeric" maxlength="15" placeholder="(11) 99999-0000" />
          </label>

          <label>
            E-mail de contato
            <input type="email" name="email" placeholder="contato@email.com" />
          </label>

          <label>
            Instagram
            <span class="input-group">
              <span class="input-group-prefix" aria-hidden="true">@</span>
              <input type="text" name="instagram" placeholder="usuario" maxlength="30" autocomplete="off" />
            </span>
            <small>Use apenas letras, números, pontos e underlines.</small>
          </label>
        </div>

        <div class="form-grid post-progressive-stage" id="postDetailsStep" hidden>
          <label class="full-span">
            Título da publicação
            <input type="text" name="title" placeholder="Ex.: Bella precisa de um lar" />
          </label>

          <label class="full-span">
            Descrição
            <textarea name="description" placeholder="Conte um pouco sobre a história, comportamento e necessidades do animal."></textarea>
          </label>

          <label>
            Estado
            <select name="state" id="postState">
              <option value="">Carregando estados...</option>
            </select>
          </label>

          <label>
            Cidade
            <select name="city" id="postCity" disabled>
              <option value="">Selecione o estado primeiro</option>
            </select>
          </label>

          <label id="postSpeciesField" hidden>
            Espécie
            <select name="species" id="postSpecies" disabled>
              <option value="">Selecione a espécie primeiro</option>
            </select>
          </label>

          <label id="postSizeField" hidden>
            Porte
            <select name="size" id="postSize" disabled>
              <option value="">Selecione o porte</option>
              <option value="Pequeno">Pequeno</option>
              <option value="Médio">Médio</option>
              <option value="Grande">Grande</option>
            </select>
          </label>

          <div class="full-span post-genetics-fields" id="postGeneticsFields" hidden>
            <label>
              Raça/Espécie do animal
              <select name="breed" id="postBreed" disabled>
                <option value="">Selecione a raça ou espécie</option>
              </select>
              <small>Escolha a raça ou espécie que melhor descreve o animal.</small>
            </label>
            <label>
              Raça ou Espécie da Mãe
              <select name="motherBreed" id="motherBreed" disabled>
                <option value="">Selecione a raça ou espécie</option>
              </select>
              <small>Se não souber, selecione “Desconhecido”.</small>
            </label>
            <label>
              Raça/Espécie do Pai
              <select name="fatherBreed" id="fatherBreed" disabled>
                <option value="">Selecione a raça ou espécie</option>
              </select>
              <small>Um dos pais deve ter a mesma raça ou espécie do animal.</small>
            </label>
            <p class="full-span genetics-validation-message" id="postGeneticsError" role="alert" hidden>
              Selecione pelo menos um dos pais com a mesma raça/espécie do animal.
            </p>
          </div>
        </div>

        <div class="form-grid post-progressive-stage" id="postMediaStep" hidden>
          <div class="full-span photo-gallery-field">
            <div class="photo-gallery-heading">
              <div>
                <strong>Fotos do animal</strong>
                <small>Adicione até 4 fotos em JPG, JPEG ou PNG.</small>
              </div>
              <span id="photoCount">0/4</span>
            </div>
            <div class="photo-gallery" id="photoGallery">
              <button class="photo-add-button" id="photoAddButton" type="button" aria-label="Adicionar fotos">+</button>
            </div>
            <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
          </div>
        </div>

        <div class="home-actions-row" style="margin-top: 24px;">
          <button type="submit" class="btn btn-primary" id="createPostSubmit" hidden>Salvar publicação</button>
          <a href="index.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </main>

    <script type="module" src="script.js?v=30"></script>
  </body>
</html>
