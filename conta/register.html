<!DOCTYPE html>
<html lang="pt-BR" class="js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../" />
    <title>Pet Amor | Registrar</title>
    <meta name="description" content="Crie sua conta Pet Amor para publicar pets e acompanhar adoções." />
    <meta name="keywords" content="Pet Amor, cadastro, criar conta, adoção de animais" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://gabrieldarcy.github.io/Projeto-Limonada-Manha/conta/register.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pet Amor" />
    <meta property="og:title" content="Pet Amor | Criar conta" />
    <meta property="og:description" content="Cadastre-se para ajudar pets a encontrar um lar." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1517849845537-4d257902454a" />
    <meta property="og:url" content="https://gabrieldarcy.github.io/Projeto-Limonada-Manha/conta/register.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="img/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="conta/register.css?v=2" />
      <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d9611b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pet Amor" />
  </head>
  <body data-page="register">
    <a class="skip-link" href="#conteudo" hidden onfocus="this.removeAttribute('hidden')" onblur="this.setAttribute('hidden','')">Pular para o conteúdo</a>
    <main class="auth-shell" id="conteudo" tabindex="-1">
      <div class="auth-panel auth-visual">
        <a class="badge auth-brand" href="index.html" aria-label="Voltar para o início da Pet Amor"><img src="img/logo.png" alt="" class="auth-brand-logo" width="20" height="20" /> Pet Amor</a>
        <h1>Faça parte da rede.</h1>
        <p>Crie anúncios e ajude pets a encontrar uma nova família.</p>
        <ul class="mini-feature-list">
          <li>Publicar animais</li>
          <li>Apoiar causas</li>
          <li>Comunidade</li>
        </ul>
      </div>

      <div class="auth-panel auth-form-panel">
        <form id="registerForm" class="auth-form">
          <div class="form-top">
            <h2>Criar conta</h2>
          </div>

          <button type="button" class="btn btn-google full" id="googleAuthButton">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.665-5.17 3.665-9.12Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.13C3.32 21.43 7.37 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.29c-.25-.72-.38-1.49-.38-2.29s.13-1.57.38-2.29V6.58H1.28C.46 8.2 0 10.04 0 12s.46 3.8 1.28 5.42l4-3.13Z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.32 2.57 1.28 6.58l4 3.13c.95-2.83 3.6-4.96 6.72-4.96Z"/>
            </svg>
            <span>Cadastrar com o Google</span>
          </button>

          <div class="auth-divider">
            <span>ou preencha com e-mail</span>
          </div>

          <label>
            Nome completo
            <input type="text" id="registerName" placeholder="Seu nome" required />
          </label>

          <label>
            Nome de usuário
            <input type="text" id="registerUsername" placeholder="@seuusuario" autocomplete="username" required />
            <small>Use letras, números, ponto ou underscore.</small>
          </label>

          <label>
            E-mail
            <input type="email" id="registerEmail" placeholder="seu@email.com" required />
          </label>

          <label>
            Data de nascimento
            <input type="text" id="registerBirthDate" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10" required />
          </label>

          <label class="file-field">
            Foto de perfil
            <input type="file" id="registerAvatar" accept="image/jpeg,image/png,image/webp" />
            <small>Opcional. JPG, JPEG, PNG ou WebP, até 8MB.</small>
          </label>

          <label>
            Senha
            <input type="password" id="registerPassword" placeholder="Crie uma senha" required />
            <div class="password-strength" aria-live="polite">
              <div class="password-strength-bar" id="passwordStrengthBar"></div>
            </div>
            <small id="passwordStrengthText">Sua senha deve ter pelo menos 8 caracteres.</small>
          </label>

          <label>
            Confirmar senha
            <input type="password" id="registerConfirmPassword" placeholder="Repita a senha" required />
          </label>

          <label class="checkbox-field">
            <input type="checkbox" id="registerTerms" required />
            <span>Li e concordo com os <a href="termos.html" class="inline-terms-btn" data-open-terms>Termos de Uso e Isenção</a>.</span>
          </label>

          <button type="submit" class="btn btn-primary full">Cadastrar</button>

          <p class="switch-link">
            Já tem conta?
            <a href="conta/login.html">Entrar</a>
          </p>
        </form>
      </div>
    </main>

    <script type="module" src="script.js?v=50"></script>
  </body>
</html>
