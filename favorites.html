<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Amor | Meus Favoritos</title>
    <meta name="description" content="Veja os animais que você salvou como favoritos na Pet Amor." />
    <meta name="keywords" content="Pet Amor, favoritos, pets salvos" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://SEU-DOMINIO.com.br/favorites.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pet Amor" />
    <meta property="og:title" content="Pet Amor | Meus favoritos" />
    <meta property="og:description" content="Acesse sua lista de animais favoritos." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1517849845537-4d257902454a" />
    <meta property="og:url" content="https://SEU-DOMINIO.com.br/favorites.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="style.css?v=23" />
  </head>
  <body data-page="favorites">
    <header class="home-header">
      <div class="container home-nav">
        <a class="brand-row" href="index.html"><img class="brand-icon" src="https://placehold.co/42x42/ffe8ce/7a3d16?text=Logo" alt="Pet Amor Logo" /><span>Pet Amor</span></a>
        <nav class="home-links">
          <a href="index.html">Início</a>
          <a href="index.html#adoes">Adoções</a>
          <a href="index.html#ajuda">Como ajudar</a>
        </nav>
        <div class="home-actions" id="homeUserActions"><a href="index.html" class="btn btn-secondary">Voltar</a></div>
      </div>
    </header>
    <main class="profile-layout">
      <section class="profile-intro">
        <span class="eyebrow">Sua seleção</span>
        <h1>Meus Favoritos</h1>
        <p>Guarde os animais que tocaram seu coração e acompanhe cada história.</p>
      </section>
      <div class="profile-post-grid" id="profileFavoritePosts"></div>
    </main>
    <div class="adoption-modal" id="adoptionModal" role="dialog" aria-modal="true" aria-labelledby="modalPostTitle" hidden>
      <div class="adoption-modal-backdrop" data-modal-close></div>
      <article class="adoption-modal-content">
        <button class="adoption-modal-close" type="button" aria-label="Fechar detalhes" data-modal-close>&times;</button>
        <div id="modalImageContainer"></div>
        <div class="adoption-modal-body">
          <span class="mini-tag">Animal</span>
          <h2 id="modalPostTitle"></h2>
          <p class="modal-location" id="modalPostLocation"></p>
          <p id="modalPostDescription"></p>
          <section class="modal-genetics"><h3>Informações de genética</h3><dl>
            <div><dt>Raça do animal</dt><dd id="modalBreed"></dd></div>
            <div><dt>Raça da mãe</dt><dd id="modalMotherBreed"></dd></div>
            <div><dt>Raça do pai</dt><dd id="modalFatherBreed"></dd></div>
          </dl></section>
          <section class="modal-contact"><h3>Contatos</h3><div id="modalPostContact"></div></section>
        </div>
      </article>
    </div>
    <footer class="home-footer">
      <div class="container footer-row"><span>© 2025 Pet Amor. Feito com carinho pelos animais.</span><div class="footer-links"><a href="index.html">Voltar ao início</a></div></div>
    </footer>
    <script type="module" src="script.js?v=23"></script>
  </body>
</html>
